<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="50%" stop-color="#5500CC" />
      <stop offset="100%" stop-color="#3A007D" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bgGrad1)" />

  <!-- Abstract decorative circles -->
  <circle cx="1050" cy="200" r="220" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="950" cy="80" r="140" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="200" cy="350" r="180" fill="#FFE600" fill-opacity="0.08" />

  <!-- Badge -->
  <g transform="translate(80, 50)">
    <rect width="170" height="38" rx="19" fill="#FFE600" />
    <text x="85" y="24" fill="#1F2026" font-family="'Inter', sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">
      KATTA SAVDO
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="140" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    Bahorgi Chegirmalar
  </text>
  <text x="80" y="200" fill="#FFE600" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    -70% gacha
  </text>

  <!-- Subtitle -->
  <text x="80" y="250" fill="#E2E5EB" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
    Barcha toifalardagi eng ommabop mahsulotlarga ulkan chegirmalar!
  </text>

  <!-- Call to action pill -->
  <g transform="translate(80, 290)">
    <rect width="190" height="52" rx="26" fill="#FFFFFF" filter="url(#shadow1)" />
    <text x="95" y="32" fill="#7000FF" font-family="'Inter', sans-serif" font-weight="800" font-size="16" text-anchor="middle">
      Xarid qilish →
    </text>
  </g>

  <!-- Right Graphic Illustration -->
  <g transform="translate(850, 190)" filter="url(#shadow1)">
    <!-- Big 3D Gift Box & Shopping Bag -->
    <rect x="-100" y="-80" width="180" height="200" rx="24" fill="#FFFFFF" fill-opacity="0.12" />
    <rect x="-80" y="-60" width="160" height="180" rx="20" fill="url(#yellowGrad)" />
    <rect x="-10" y="-60" width="20" height="180" fill="#FF8800" />
    <rect x="-80" y="20" width="160" height="20" fill="#FF8800" />
    
    <!-- Bow -->
    <ellipse cx="-20" cy="-70" rx="30" ry="15" fill="#FFAA00" transform="rotate(-20 -20 -70)" />
    <ellipse cx="20" cy="-70" rx="30" ry="15" fill="#FFAA00" transform="rotate(20 20 -70)" />
    <circle cx="0" cy="-65" r="12" fill="#FF8800" />

    <!-- Sparkles / Stars -->
    <path d="M120 -80 L125 -65 L140 -60 L125 -55 L120 -40 L115 -55 L100 -60 L115 -65 Z" fill="#FFE600" />
    <path d="M-150 50 L-146 62 L-134 66 L-146 70 L-150 82 L-154 70 L-166 66 L-154 62 Z" fill="#FFFFFF" />
    <path d="M140 100 L144 110 L154 113 L144 116 L140 126 L136 116 L126 113 L136 110 Z" fill="#FFE600" />
  </g>
</svg>